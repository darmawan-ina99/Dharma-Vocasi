<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://whtsromktkymksuvagrw.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Maestro Vokasi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F7FF;--card:#FFFFFF;--line:#E3E8F5;--gold:#4F46E5;--gold2:#4F46E5;--acc:#0B9A8D;--txt:#14183A;--dim:#5B6385}
body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6;padding:20px 14px 80px;max-width:680px;margin:0 auto;-webkit-font-smoothing:antialiased}
.brandbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.brandbar img{height:38px;width:auto}
h1{font-family:Syne,sans-serif;font-size:22px;margin-bottom:2px;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,24,58,.05),0 2px 8px rgba(20,24,58,.05)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin:10px 0 5px}
input,textarea,select{width:100%;background:#fff;border:1.5px solid #D5DBF5;border-radius:12px;color:var(--txt);padding:12px;font-size:14px;font-family:inherit;min-height:46px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#4F46E5;box-shadow:0 0 0 4px rgba(79,70,229,.14)}
textarea{min-height:120px;resize:vertical}
.btn{width:100%;background:linear-gradient(135deg,#4F46E5,#6D5DF6);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;min-height:48px;box-shadow:0 8px 18px rgba(79,70,229,.3);margin-top:12px}
.btn.alt{background:#fff;border:1.5px solid #CBD2F3;color:#3730A3;box-shadow:none}
.btn.red{background:#fff;border:1.5px solid #F43F5E;color:#E11D48;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
.stat{display:inline-block;background:#EEF2FF;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:4px;font-size:13px}
.stat b{color:#3730A3;font-size:18px;font-family:Syne,sans-serif}
.unit{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;display:flex;gap:8px;align-items:center}
.unit .u{flex:1}
.tag{font-size:9.5px;font-weight:700;background:#FFF1D6;color:#B45309;border-radius:8px;padding:2px 7px}
.tag.rv{background:#DDF7F3;color:#06796E}
a{color:#4F46E5}
.hidden{display:none}
.audit{font-size:11.5px;color:var(--dim);font-family:monospace;border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.ok{color:#0B9A8D;font-weight:700}.err{color:#E11D48;font-weight:700}
button:focus-visible{outline:3px solid rgba(79,70,229,.45);outline-offset:2px}
</style>
</head>
<body>
<div class="brandbar"><img src="logo-dharma-labs.png" alt="Dharma-Labs Digital"><h1>Admin Maestro Vokasi</h1></div>
<div class="sub">Panel pengelola kurikulum & statistik — Dharma Labs Digital</div>

<div id="login" class="card">
  <label>PIN Superadmin</label>
  <input id="pin" type="password" maxlength="6" inputmode="numeric">
  <button class="btn" onclick="login()">Masuk</button>
  <div id="loginMsg" style="margin-top:8px;font-size:13px"></div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <b>Statistik</b><br><span id="stats"></span>
    <div class="audit" id="audit"></div>
  </div>

  <div class="card">
    <b>➕ Tambah / Ubah Materi</b>
    <div class="row">
      <div><label>ID unit</label><input id="uId" placeholder="k5-mat-2"></div>
      <div><label>Kelas (1–9)</label><input id="uKelas" type="number" min="1" max="9"></div>
    </div>
    <div class="row">
      <div><label>Jalur (track)</label><select id="uTrack">
        <option value="sd">sd (Sekolah 1-6)</option><option value="smp">smp (7-9)</option>
        <option value="sma">sma (10-12)</option><option value="smk">smk (10-12)</option>
        <option value="lang">lang (Akademi Bahasa)</option>
        <option value="ai">ai (Akademi AI)</option><option value="voc">voc (Vokasi)</option>
      </select></div>
      <div><label>Level (A1/N5/HSK1/cyber/0-6)</label><input id="uLevel" placeholder="A1"></div>
    </div>
    <div class="row">
      <div><label>Mapel</label><input id="uMapel" placeholder="Matematika"></div>
      <div><label>Semester</label><input id="uSem" type="number" min="1" max="2" value="1"></div>
    </div>
    <label>Judul</label><input id="uJudul">
    <label>Materi (HTML sederhana)</label><textarea id="uMateri"></textarea>
    <label>Soal — format JSON array: [{"q":"soal","o":["a","b","c","d"],"a":1,"p":"pembahasan"}]</label>
    <textarea id="uSoal" placeholder='[{"q":"1+1=?","o":["1","2","3","4"],"a":1,"p":"penjumlahan dasar"}]'></textarea>
    <label>Status</label>
    <select id="uStatus"><option value="demo">DEMO (belum tervalidasi)</option><option value="final">Tinjau (reviewed)</option></select>
    <button class="btn" onclick="saveUnit()">💾 Simpan ke Server</button>
    <div id="saveMsg" style="margin-top:8px;font-size:13px"></div>
  </div>

  <div class="card">
    <b>📚 Daftar Materi (dari server)</b>
    <button class="btn alt" onclick="loadList()" style="margin-top:8px">Muat / Segarkan</button>
    <div id="unitList" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <button class="btn red" onclick="logout()">Keluar</button>
  </div>
</div>

<script>
function E(v){return String(v==null?'':v).replace(/[&<>"'`]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]})}
const MV = { url: 'https://whtsromktkymksuvagrw.supabase.co/rest/v1/rpc/', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodHNyb21rdGt5bWtzdXZhZ3J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNTMzMTIsImV4cCI6MjEwNjkyOTMxMn0.Ey3dgYFJP0rI57eBkNtFgJjl_Qf-KI0H7dpfD_t4Kos', app: 'mv-DJOrpw5N0iMIELtz' };
let PIN = '';
const $ = id => document.getElementById(id);
function rpc(fn, body) {
  return fetch(MV.url + fn, { method: 'POST',
    headers: { 'apikey': MV.key, 'Authorization': 'Bearer ' + MV.key, 'Content-Type': 'application/json' },
    body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
async function login() {
  PIN = $('pin').value.trim();
  const d = await rpc('mv_stats', { p_pin: PIN }).catch(() => null);
  if (d && d.users !== undefined) {
    $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
    $('stats').innerHTML =
      `<span class="stat">Pengguna <b>${+d.users||0}</b></span>` +
      `<span class="stat">Progres <b>${+d.progress||0}</b></span>` +
      `<span class="stat">Materi <b>${+d.units||0}</b></span>` +
      `<span class="stat">Sertifikat <b>${+d.certs||0}</b></span>`;
    $('audit').innerHTML = '<b style="color:var(--txt)">Audit terbaru:</b><br>' +
      (d.audit || []).map(a => `${E(new Date(a.at).toLocaleString('id-ID'))} · ${E(a.actor)} · ${E(a.action)} · ${E(a.detail)}`).join('<br>');
    loadList();
  } else {
    $('loginMsg').innerHTML = '<span class="err">✕ PIN salah atau server tidak terjangkau.</span>';
  }
}
function fill(u) {
  $('uId').value = u.id; $('uKelas').value = u.kelas || 0; $('uMapel').value = u.mapel;
  $('uTrack').value = u.track || 'sd'; $('uLevel').value = u.level || '';
  $('uSem').value = u.semester || 1; $('uJudul').value = u.judul;
  $('uMateri').value = u.materi || ''; $('uSoal').value = JSON.stringify(u.soal || [], null, 1);
  $('uStatus').value = u.reviewed ? 'final' : 'demo';
  window.scrollTo(0, 0);
}
async function saveUnit() {
  let soal;
  try { soal = JSON.parse($('uSoal').value || '[]'); }
  catch (e) { $('saveMsg').innerHTML = '<span class="err">✕ Format soal bukan JSON valid.</span>'; return; }
  const unit = {
    id: $('uId').value.trim(), track: $('uTrack').value, level: $('uLevel').value.trim(),
    kelas: (isNaN(parseInt($('uKelas').value)) ? 0 : parseInt($('uKelas').value)), semester: parseInt($('uSem').value),
    mapel: $('uMapel').value.trim(), judul: $('uJudul').value.trim(),
    materi: $('uMateri').value, soal: soal,
    status: $('uStatus').value === 'final' ? 'final' : 'demo',
    reviewed: $('uStatus').value === 'final'
  };
  if (!unit.id || !unit.mapel) {
    $('saveMsg').innerHTML = '<span class="err">✕ ID dan mapel wajib.</span>'; return;
  }
  const r = await rpc('mv_kur_save', { p_pin: PIN, p_units: [unit] }).catch(() => null);
  if (r && r.ok) { $('saveMsg').innerHTML = '<span class="ok">✓ ' + (+r.saved||0) + ' materi tersimpan di server.</span>'; loadList(); }
  else $('saveMsg').innerHTML = '<span class="err">✕ Gagal: ' + E(r && r.msg || 'server') + '</span>';
}
async function loadList() {
  const d = await rpc('mv_kur_get', { p_app: MV.app }).catch(() => null);
  if (!d) { $('unitList').textContent = 'Gagal memuat.'; return; }
  if (!Array.isArray(d)) { $('unitList').textContent = 'Data tidak valid.'; return; }
  window._units = d;
  $('unitList').innerHTML = d.map((u, i) =>
    `<div class="unit"><div class="u"><b>${E(u.judul || u.id)}</b> ` +
    (u.reviewed ? '<span class="tag rv">REVIEWED</span>' : '<span class="tag">DEMO</span>') +
    `<br><small style="color:var(--dim)">${E(u.track || 'sd')} · K${E(u.kelas)} ${u.level ? '· ' + E(u.level) : ''} · ${E(u.mapel)} · ${u.soal ? (+u.soal.length||0) : 0} soal</small></div>` +
    `<button class="btn alt" style="width:auto;padding:6px 10px;margin:0" data-edit="${i}">Ubah</button></div>`).join('');
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-edit]') : null;
  if (t && window._units) fill(window._units[+t.getAttribute('data-edit')]);
});
function logout() { PIN = ''; location.reload(); }
</script>
</body>
</html>
